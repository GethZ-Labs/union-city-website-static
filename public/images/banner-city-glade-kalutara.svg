<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042024"/>
      <stop offset="50%" stop-color="#0d4d54"/>
      <stop offset="100%" stop-color="#020f12"/>
    </linearGradient>
    <linearGradient id="accentGrad_6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <radialGradient id="glow_6" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_6" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#2DD4BF" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow_6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_6)"/>
  <rect width="800" height="480" fill="url(#glow_6)"/>
  <rect width="800" height="480" fill="url(#grid_6)"/>

  
      <!-- River and Coastal Graphics -->
      <g opacity="0.38">
        <path d="M-50,320 C 150,260 300,380 500,320 C 700,260 800,340 900,310" fill="none" stroke="#2DD4BF" stroke-width="4"/>
        <path d="M-50,360 C 150,300 300,420 500,360 C 700,300 800,380 900,350" fill="none" stroke="#99F6E4" stroke-width="2" stroke-dasharray="6 6"/>
        <path d="M-50,400 C 180,350 320,450 520,400 C 720,350 820,410 900,390" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.6"/>
        <circle cx="680" cy="180" r="50" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-dasharray="4 4"/>
        <polygon points="560,220 640,160 720,220" fill="#2DD4BF" opacity="0.4"/>
        <rect x="580" y="220" width="120" height="70" fill="#99F6E4" opacity="0.3"/>
      </g>

  <!-- Dark Bottom Contrast Layer -->
  <rect y="210" width="800" height="270" fill="url(#bgGrad_6)" opacity="0.88"/>

  <!-- Top Header: Brand Badge -->
  <g transform="translate(36, 36)">
    <rect width="216" height="32" rx="16" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="url(#accentGrad_6)"/>
    <text x="32" y="21" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5">UNION CITY DEVELOPERS</text>
  </g>

  <!-- Sold Out Red Badge -->
  <g transform="translate(630, 32)" filter="url(#shadow_6)">
    <rect width="134" height="34" rx="7" fill="#DC2626" stroke="#FECACA" stroke-width="1.5"/>
    <text x="67" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="900" letter-spacing="2" text-anchor="middle">SOLD OUT</text>
  </g>

  <!-- Project Number Badge -->
  <g transform="translate(36, 88)">
    <rect width="72" height="24" rx="6" fill="rgba(45, 212, 191, 0.15)" stroke="#2DD4BF" stroke-width="1"/>
    <text x="36" y="16" fill="#99F6E4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">PRJ-07</text>
  </g>

  <!-- Location Badge Pill -->
  <g transform="translate(118, 88)">
    <rect width="200" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#2DD4BF"/>
    <text x="26" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">Kalutara</text>
  </g>

  <!-- Project Title -->
  <text x="36" y="316" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Outfit, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">City Glade Kalutara</text>

  <!-- Highlights Line -->
  <g transform="translate(36, 346)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="4" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">Nagas Junction • Walking distance to Galle Road</text>
  </g>

  <!-- Meta Status Footer -->
  <g transform="translate(36, 412)">
    <rect width="728" height="40" rx="8" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="22" cy="20" r="9" fill="#10B981"/>
    <path d="M 18 20 L 21 23 L 27 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">100% Sold Out &amp; Successfully Handed Over</text>
    <text x="700" y="24" fill="#99F6E4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">CLEAR DEEDS • GATED EXCELLENCE</text>
  </g>
</svg>