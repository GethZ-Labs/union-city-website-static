<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f2b"/>
      <stop offset="50%" stop-color="#3b1e61"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </linearGradient>
    <linearGradient id="accentGrad_7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <radialGradient id="glow_7" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_7" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#C084FC" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_7)"/>
  <rect width="800" height="480" fill="url(#glow_7)"/>
  <rect width="800" height="480" fill="url(#grid_7)"/>

  
      <!-- Luxury Villa & Estate Graphics -->
      <g opacity="0.32">
        <path d="M-40,400 Q 300,320 540,380 T 860,330" fill="none" stroke="#C084FC" stroke-width="3" stroke-dasharray="8 4"/>
        <g transform="translate(500, 100)">
          <!-- Villa 1 -->
          <polygon points="40,140 110,80 180,140" fill="#C084FC"/>
          <rect x="55" y="140" width="110" height="90" fill="#E9D5FF"/>
          <rect x="70" y="155" width="30" height="40" fill="#fff" opacity="0.6"/>
          <rect x="115" y="155" width="35" height="40" fill="#fff" opacity="0.6"/>
          <!-- Villa 2 -->
          <polygon points="160,120 240,60 300,120" fill="#E9D5FF"/>
          <rect x="180" y="120" width="100" height="110" fill="#C084FC"/>
          <rect x="195" y="140" width="30" height="45" fill="#fff" opacity="0.7"/>
          <rect x="235" y="140" width="30" height="45" fill="#fff" opacity="0.7"/>
          <!-- Gate post & lanterns -->
          <rect x="10" y="180" width="12" height="50" fill="#C084FC"/>
          <rect x="8" y="170" width="16" height="10" fill="#E9D5FF"/>
        </g>
      </g>

  <!-- Dark Bottom Contrast Layer -->
  <rect y="210" width="800" height="270" fill="url(#bgGrad_7)" opacity="0.88"/>



  <!-- Sold Out Red Badge -->
  <g transform="translate(630, 32)" filter="url(#shadow_7)">
    <rect width="134" height="34" rx="7" fill="#DC2626" stroke="#FECACA" stroke-width="1.5"/>
    <text x="67" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="900" letter-spacing="2" text-anchor="middle">SOLD OUT</text>
  </g>

  <!-- Project Number Badge -->
  <g transform="translate(36, 88)">
    <rect width="72" height="24" rx="6" fill="rgba(192, 132, 252, 0.15)" stroke="#C084FC" stroke-width="1"/>
    <text x="36" y="16" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">PRJ-08</text>
  </g>

  <!-- Location Badge Pill -->
  <g transform="translate(118, 88)">
    <rect width="200" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#C084FC"/>
    <text x="26" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">Athurugiriya</text>
  </g>

  <!-- Project Title -->
  <text x="36" y="316" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Outfit, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">Infinity Athurugiriya</text>

  <!-- Highlights Line -->
  <g transform="translate(36, 346)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#C084FC" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="4" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">Facing paddy field • Rapid Southern Highway access</text>
  </g>

  <!-- Meta Status Footer -->
  <g transform="translate(36, 412)">
    <rect width="728" height="40" rx="8" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="22" cy="20" r="9" fill="#10B981"/>
    <path d="M 18 20 L 21 23 L 27 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">100% Sold Out &amp; Successfully Handed Over</text>
    <text x="700" y="24" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">CLEAR DEEDS • GATED EXCELLENCE</text>
  </g>
</svg>