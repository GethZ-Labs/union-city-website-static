<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062316"/>
      <stop offset="50%" stop-color="#0d4527"/>
      <stop offset="100%" stop-color="#03120b"/>
    </linearGradient>
    <linearGradient id="accentGrad_1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <radialGradient id="glow_1" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_1" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#00E676" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow_1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bgGrad_1)"/>
  <rect width="800" height="480" fill="url(#glow_1)"/>
  <rect width="800" height="480" fill="url(#grid_1)"/>

  
    <!-- Serene Land & Plantation Graphics -->
    <g opacity="0.35">
      <path d="M-50,390 Q 220,290 480,370 T 860,300" fill="none" stroke="#00E676" stroke-width="3" stroke-dasharray="8 6"/>
      <path d="M-50,440 Q 260,340 520,420 T 860,360" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Trees & foliage -->
      <g transform="translate(420, 150)">
        <circle cx="80" cy="90" r="55" fill="#00E676"/>
        <circle cx="130" cy="70" r="65" fill="#A7F3D0"/>
        <circle cx="180" cy="95" r="45" fill="#00E676"/>
        <rect x="124" y="110" width="12" height="90" fill="#041209"/>
        <circle cx="270" cy="110" r="45" fill="#00E676"/>
        <circle cx="310" cy="95" r="55" fill="#A7F3D0"/>
        <rect x="304" y="125" width="12" height="75" fill="#041209"/>
      </g>
    </g>

  <!-- Dark Bottom Contrast Layer -->
  <rect y="210" width="800" height="270" fill="url(#bgGrad_1)" opacity="0.88"/>



  <!-- Sold Out Red Badge -->
  <g transform="translate(630, 32)" filter="url(#shadow_1)">
    <rect width="134" height="34" rx="7" fill="#DC2626" stroke="#FECACA" stroke-width="1.5"/>
    <text x="67" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="900" letter-spacing="2" text-anchor="middle">SOLD OUT</text>
  </g>

  <!-- Project Number Badge -->
  <g transform="translate(36, 88)">
    <rect width="72" height="24" rx="6" fill="rgba(0, 230, 118, 0.15)" stroke="#00E676" stroke-width="1"/>
    <text x="36" y="16" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">PRJ-02</text>
  </g>

  <!-- Location Badge Pill -->
  <g transform="translate(118, 88)">
    <rect width="200" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#00E676"/>
    <text x="26" y="16" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">Meegoda</text>
  </g>

  <!-- Project Title -->
  <text x="36" y="316" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Outfit, sans-serif" font-size="33" font-weight="900" letter-spacing="-0.5">Highlevel Terrace Meegoda</text>

  <!-- Highlights Line -->
  <g transform="translate(36, 346)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#00E676" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="4" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">Facing scenic paddy fields • Walking distance to Economic Center</text>
  </g>

  <!-- Meta Status Footer -->
  <g transform="translate(36, 412)">
    <rect width="728" height="40" rx="8" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="22" cy="20" r="9" fill="#10B981"/>
    <path d="M 18 20 L 21 23 L 27 17" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">100% Sold Out &amp; Successfully Handed Over</text>
    <text x="700" y="24" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="end">CLEAR DEEDS • GATED EXCELLENCE</text>
  </g>
</svg>