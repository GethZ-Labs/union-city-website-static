<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="uhBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Emerald to Forest Green Gradient -->
    <linearGradient id="uhGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Golden Amber Accent Gradient -->
    <linearGradient id="uhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="uhShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Protective Modern Shield Ring (Subtle) -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.12" />
  
  <!-- Left Wing / Union Pillar (Emerald Green) -->
  <path d="M 110 370 
           L 110 240 
           C 110 220 125 204 144 198 
           L 242 165 
           C 248 163 254 163 260 165 
           L 290 175 
           L 250 205 
           L 185 228 
           C 178 230 172 237 172 245 
           L 172 370 
           C 172 376 167 380 161 380 
           L 121 380 
           C 115 380 110 376 110 370 Z" 
        fill="url(#uhGreenGrad)" />

  <!-- Main House Gable & Right Arch (Sapphire Blue) -->
  <path d="M 250 82 
           L 380 190 
           C 388 197 392 207 392 218 
           L 392 370 
           C 392 376 387 380 381 380 
           L 335 380 
           C 329 380 324 376 324 370 
           L 324 235 
           C 324 228 320 221 314 216 
           L 250 162 
           L 186 216 
           C 180 221 176 228 176 235 
           L 176 275 
           L 130 250 
           L 240 92 
           C 246 87 254 87 260 92 Z" 
        fill="url(#uhBlueGrad)" 
        filter="url(#uhShadow)" />

  <!-- Central Sanctuary / Chimney / Horizon Geometry -->
  <path d="M 315 135 
           L 345 135 
           L 345 170 
           L 315 145 Z" 
        fill="url(#uhBlueGrad)" opacity="0.8" />

  <!-- Interlocking Central Heart / Foundation Key (Geometric Doorway to Prosperity) -->
  <path d="M 215 380 
           L 215 285 
           C 215 265 230 250 250 250 
           C 270 250 285 265 285 285 
           L 285 380 
           Z" 
        fill="url(#uhGoldGrad)" />

  <!-- Door Arch Inset -->
  <path d="M 235 380 
           L 235 295 
           C 235 287 242 280 250 280 
           C 258 280 265 287 265 295 
           L 265 380 
           Z" 
        fill="#041226" opacity="0.8" />

  <!-- Sun Rising / Vitality Dot -->
  <circle cx="250" cy="120" r="14" fill="url(#uhGoldGrad)" />
</svg>
